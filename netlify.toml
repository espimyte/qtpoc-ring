[functions]
directory = "functions"
included_files = ["data/members.json"]

[[redirects]]
from = "/next"
to = "/.netlify/functions/next"
status = 301
force = true

[[redirects]]
from = "/previous"
to = "/.netlify/functions/previous"
status = 301
force = true

[[redirects]]
from = "/random"
to = "/.netlify/functions/random"
status = 301
force = true